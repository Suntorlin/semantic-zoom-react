<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Set the theme before the first paint, so dark mode doesn't flash white.
      ;(function () {
        var q = new URLSearchParams(location.search).get('theme')
        var s = localStorage.getItem('sz-demo-theme')
        var t = q === 'dark' || q === 'light' ? q : s === 'dark' || s === 'light' ? s : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      })()
    </script>
    <title>semantic-zoom-react 演示</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
